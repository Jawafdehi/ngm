name: PPMO Blacklist Scraper

on:
  schedule:
    # Run weekly on Sundays at 4:00 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  POETRY_VERSION: '2.3.2'

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'
    
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          
      - name: Install poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
        
      - name: Run PPMO blacklist scraper
        working-directory: ./ngm
        run: poetry run scrapy crawl ppmo_blacklist
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ENDPOINT_URL: 'https://4c96557d73194d4f245ba23bd6063ad5.r2.cloudflarestorage.com'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'auto'
          FILES_STORE: 's3://ngm/uploads/'

      - name: Notify on failure
        if: failure()
        run: poetry run python scripts/notify_failure.py "FAILED" "PPMO Scraper failed"
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GITHUB_JOB_NAME: "PPMO Blacklist Scraper"
