name: Supreme Court Orders Scraper

on:
  schedule:
    # Run every 8 hours: 00:00, 08:00, 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Google Cloud SQL Proxy
        uses: NewNepal-org/gce-cloudsql-proxy-action@145471ad36a0211ca4a7b90af14587bcc35b3c99 # master as of 2026-03-01
        with:
          creds: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          instance: ${{ secrets.NGM_SQL_INSTANCE }}

      - name: Run Supreme Court Orders scraper
        working-directory: ./ngm
        # Processes up to 600 cases per 6-hour job at 100 cases/hour.
        # Rate: DOWNLOAD_DELAY=18s × 2 requests/case = 36s/case → 100 cases/hour
        # 100 cases/hour × 6 hours = 600 cases per job
        run: poetry run scrapy crawl supreme_court_orders -a limit=600
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENABLE_CAPTCHA_COOKIE_EXTRACT: "True"