name: Court Orders Scraper

on:
  schedule:
    # Run every 8 hours: 00:00, 08:00, 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-2.3.2-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Supreme Court Orders scraper
        working-directory: ./ngm
        # Processes up to 1200 cases per 6-hour job at 200 cases/hour.
        # Rate: DOWNLOAD_DELAY=9s × 2 requests/case = 18s/case → 200 cases/hour
        # 200 cases/hour × 6 hours = 1200 cases per job
        run: poetry run scrapy crawl supreme_court_orders -a limit=1200
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENABLE_CAPTCHA_COOKIE_EXTRACT: "True"
          AWS_ENDPOINT_URL: 'https://4c96557d73194d4f245ba23bd6063ad5.r2.cloudflarestorage.com'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'auto'
          FILES_STORE: 's3://ngm/uploads/'