name: Court Orders Scraper

on:
  schedule:
    # Run every 8 hours: 00:00, 08:00, 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  POETRY_VERSION: '2.3.2'

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Start Cloud SQL Proxy
        uses: Jawafdehi/gce-cloudsql-proxy-action@master
        with:
          creds: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          instance: ${{ secrets.CLOUD_SQL_INSTANCE }}
          port: 5432

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Supreme Court Orders scraper
        working-directory: ./ngm
        # Processes up to 3000 cases per 6-hour job at 600 cases/hour.
        # Rate: DOWNLOAD_DELAY=3s x 2 requests/case = 6s/case -> 600 cases/hour
        # 600 cases/hour x 5 hours = 3000 cases per job (1-hour buffer for overhead)
        run: poetry run scrapy crawl supreme_court_orders -a limit=3000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROXY }}
          ENABLE_CAPTCHA_COOKIE_EXTRACT: "True"
          AWS_ENDPOINT_URL: 'https://4c96557d73194d4f245ba23bd6063ad5.r2.cloudflarestorage.com'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'auto'
          FILES_STORE: 's3://ngm/uploads/'
