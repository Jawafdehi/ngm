name: CIAA Dataset Pipeline

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: 'Starting BS fiscal year (inclusive). Leave empty to default to current FY - 3 (last 4 FYs).'
        required: false
        type: string

env:
  POETRY_VERSION: '2.3.2'

permissions:
  contents: read

concurrency:
  group: ciaa-dataset-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies # installs all library project needs
        run: poetry install --no-interaction --no-root

      - name: Install project # install the actual project (ngm)
        run: poetry install --no-interaction

      - name: Resolve pipeline arguments
        id: args
        run: |
          # Validate and sanitize input from_year
          INPUT_YEAR="${{ inputs.from_year }}"
          
          if [ -n "$INPUT_YEAR" ]; then
            # Validate format: must be 4 digits starting with 20
            if ! echo "$INPUT_YEAR" | grep -qE '^20[0-9]{2}$'; then
              echo "Error: Invalid fiscal year format '$INPUT_YEAR'. Expected format: 20XX (e.g., 2078)"
              exit 1
            fi
            FROM_YEAR="$INPUT_YEAR"
          else
            # Default to (current FY - 3) for last 4 FYs
            FROM_YEAR=$(TZ=Asia/Kathmandu python3 - <<'PY'
          from datetime import datetime
          n = datetime.now()
          fy = n.year + (57 if (n.month, n.day) >= (7, 16) else 56)
          print(fy - 3)
          PY
          )
          fi
          
          echo "pipeline_args=--from-year $FROM_YEAR" >> "$GITHUB_OUTPUT"
          echo "Resolved from_year: $FROM_YEAR"

      - name: Run CIAA Dataset Pipeline
        working-directory: ./ngm
        run: poetry run python -m ngm.ciaa_dataset.pipeline ${{ steps.args.outputs.pipeline_args }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUTPUT_DIR: 's3://ngm/uploads/'
          AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'auto'
          # LLM_API_KEY: Google Gemini API key
          # LLM: model in format google_genai:model-name (e.g. google_genai:gemini-2.0-flash-lite)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM: ${{ secrets.LLM }}
