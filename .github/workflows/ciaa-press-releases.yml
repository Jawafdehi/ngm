name: CIAA Press Releases Scraper

on:
  schedule:
    # Run every day at 3:30 AM UTC (9:15 AM Nepal Time)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allow manual trigger; spider self-terminates via consecutive-missing logic


permissions:
  contents: read

concurrency:
  group: ciaa-press-releases-scraper
  cancel-in-progress: false


jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Run CIAA Press Releases scraper
        working-directory: ./ngm
        run: poetry run scrapy crawl ciaa_press_releases
        env:
          AWS_ENDPOINT_URL: 'https://4c96557d73194d4f245ba23bd6063ad5.r2.cloudflarestorage.com'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'auto'
          FILES_STORE: 's3://ngm/uploads/'
