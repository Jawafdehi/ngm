name: Special Court Cases Scraper

on:
  schedule:
    # Run daily at 3:30 AM UTC (9:15 AM Nepal Time)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  POETRY_VERSION: '2.3.2'

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Special Court scraper
        working-directory: ./ngm
        run: poetry run scrapy crawl special_court_cases
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check for schema drift
        if: success()
        run: poetry run python scripts/check_schema_drift.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify on failure
        if: failure()
        run: poetry run python scripts/notify_failure.py "FAILED" "Scraper or schema check failed"
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GITHUB_JOB_NAME: "Special Court Scraper"

  enrich:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.POETRY_VERSION }}-${{ hashFiles('poetry.lock') }}
      
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Special Court enrichment spider
        working-directory: ./ngm
        run: poetry run scrapy crawl special_case_enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify on failure
        if: failure()
        run: poetry run python scripts/notify_failure.py "FAILED" "Enrichment spider failed"
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          GITHUB_JOB_NAME: "Special Court Enrichment"