name: High Court Cases Enrichment

on:
  schedule:
    # TEMPORARY: Run every 8 hours for backfilling (will revert to daily)
    # Offset by 2 hours after scraper to ensure new cases are scraped first
    # Scraper runs at: 1:32, 9:32, 17:32 UTC
    # Enrichment runs at: 3:32, 11:32, 19:32 UTC (2 hours later)
    - cron: '32 3,11,19 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  enrich:
    runs-on: ubuntu-latest
    environment: 'NGM Scrape'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Run High Court enrichment spider
        working-directory: ./ngm
        run: poetry run scrapy crawl high_court_enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
