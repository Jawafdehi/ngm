[tool.poetry]
name = "ngm"
version = "0.1.0"
description = "Nepal Government Modernization - Judicial Data Scrapers"
authors = ["Jawafdehi Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
scrapy = "^2.16.0"
beautifulsoup4 = "^4.14.3"
python-dateutil = "^2.9.0.post0"
nepali = "^1.2.0"
boto3 = "^1.43.24"
python-dotenv = "^1.2.2"
psycopg2-binary = "^2.9.12"
sqlalchemy = "^2.0.50"
pytz = "^2026.2"
cloudpathlib = {extras = ["s3"], version = "^0.24.0"}
pydantic = "^2.13"
rapidfuzz = "^3.0"
google-genai = "^2.8.0"
sentry-sdk = {extras = ["structlog"], version = "^2.61.0"}
structlog = "^25.5.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^24.0.0"
ruff = "^0.15.16"
